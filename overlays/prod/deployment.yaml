cat << 'EOF' > overlays/prod/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seclock
  namespace: seclock
  labels:
    app: seclock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seclock
  template:
    metadata:
      labels:
        app: seclock
    spec:
      containers:
      - name: seclock
        image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/seclock:initial
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
EOF
